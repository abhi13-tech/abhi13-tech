name: generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: abhi13-tech
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Fetch static stats cards
        run: |
          mkdir -p dist
          curl -fsSL --retry 3 "https://github-readme-stats-sigma-five.vercel.app/api?username=abhi13-tech&show_icons=true&hide_border=true&bg_color=0d1117&title_color=00C853&text_color=c9d1d9&icon_color=00C853&include_all_commits=true&rank_icon=github" -o dist/stats.svg
          curl -fsSL --retry 3 "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=abhi13-tech&layout=compact&hide_border=true&bg_color=0d1117&title_color=00C853&text_color=c9d1d9&langs_count=8" -o dist/top-langs.svg
          # SVG-as-<img> animations are frozen at t=0 in current Chrome; zero the
          # durations so fill-forwards animations land on their final visible state
          sed -i 's#</svg>#<style>*{animation-duration:0s!important;animation-delay:0s!important}</style></svg>#' dist/stats.svg dist/top-langs.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

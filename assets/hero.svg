<svg xmlns="http://www.w3.org/2000/svg" width="640" height="64" viewBox="0 0 640 64" role="img" aria-label="abhishek reddy — AI Engineer · LLM Systems — building ai that ships">
  <style>
    text {
      font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 26px;
      font-weight: 600;
      fill: #00C853;
    }
    .line { opacity: 0; }
    .l1 { opacity: 1; animation: cycleFirst 9s linear infinite; }
    .l2 { animation: cycle 9s linear 3s infinite; }
    .l3 { animation: cycle 9s linear 6s infinite; }
    @keyframes cycleFirst {
      0% { opacity: 1; }
      30% { opacity: 1; }
      33% { opacity: 0; }
      96% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes cycle {
      0% { opacity: 0; }
      3% { opacity: 1; }
      30% { opacity: 1; }
      33% { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="line l1">abhishek reddy<tspan class="cursor">▌</tspan></text>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="line l2">AI Engineer · LLM Systems<tspan class="cursor">▌</tspan></text>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="line l3">building ai that ships<tspan class="cursor">▌</tspan></text>
</svg>
